version: "2"
run:
  go: 1.27.0
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader # This linter appears to not find all matches on every run; might be too annoying
    - containedctx
    - copyloopvar
    - cyclop 
    - dupword
    - durationcheck
    - err113 
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive 
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - goconst 
    - gocritic 
    - gosec 
    - govet
    - ineffassign
    - intrange
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - nilnesserr
    - nilnil
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck 
  settings:
    staticcheck:
      checks: ["all", "-ST1016"] # Nice to have, but annoying
    errcheck:
      exclude-functions:
        - crypto/rand.Read
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable-all: true 
    prealloc:
      for-loops: true
    revive:
      confidence: 0.6
      rules:
        - name: argument-limit
          severity: warning
          disabled: false
          exclude: [""]
          arguments: [5]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Vendored copy of go-qrcode/writer/standard, kept close to upstream so it can be
      # re-synced; its style is upstream's to own, not ours.
      - path: asig/internal/qrimage/
        linters:
          - cyclop
          - err113
          - exhaustive
          - gocritic
          - gosec
          - govet
          - intrange
          - perfsprint
          - revive
          - staticcheck
          - whitespace
          - wrapcheck
      - linters:
          - staticcheck
        text: (QF1003|QF1008|QF1006)
      - linters:
          - revive
        path: (.+)_test.go
        text: ^(unused-parameter|add-constant)
      # In a table-driven test the repeated literal is the fixture; folding it into a
      # constant would leave the test asserting a constant against itself.
      - linters:
          - goconst
        path: (.+)_test.go
formatters:
  enable:
    - gofmt
    - goimports
